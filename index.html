<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<!-- 移动端视口完美适配，禁止缩放、适配刘海屏 -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
	<title>liaoke御用专线</title>
	<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
	<style>
		:root {
			--ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
			--pink-accent: #F598F2;
			--light-blue: #38bdf8;
			--mobile-break: 809.98px;
			--tablet-min: 810px;
			--tablet-max: 1199.98px;
			--transition-long: 1200ms ease-in-out;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			outline: none;
			-webkit-tap-highlight-color: transparent;
		}

		/* 修复移动端高度裁切，禁止滚动 */
		html, body {
			height: 100vh;
			height: 100dvh;
			overflow: hidden;
			position: fixed;
			width: 100%;
		}

		@media (prefers-reduced-motion: reduce) {
			*,
			*::before,
			*::after {
				animation-duration: 0.01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: 0.01ms !important;
			}
		}

		body {
			font-family: 'Figtree', sans-serif;
			background: #000;
			color: #fff;
			overflow-x: hidden;
		}

		/* 弹窗遮罩层 */
		.modal-mask {
			position: fixed;
			inset: 0;
			background: rgba(0,0,0,0.75);
			z-index: 999;
			display: none;
			align-items: center;
			justify-content: center;
		}
		.modal-mask.show {
			display: flex;
		}
		.modal-box {
			background: #111;
			border: 1px solid #38bdf8;
			padding: 30px 40px;
			border-radius: 12px;
			text-align: center;
			animation: modalIn 0.3s ease;
			min-width: 320px;
		}
		.modal-text {
			font-size: 18px;
			margin-top: 24px;
		}
		.modal-btn {
			padding: 8px 24px;
			border: 1px solid #38bdf8;
			background: transparent;
			color: #38bdf8;
			border-radius: 6px;
			cursor: pointer;
			transition: 0.3s;
			margin-top: 20px;
		}
		.modal-btn:hover {
			background: #38bdf8;
			color: #000;
		}
		@keyframes modalIn {
			from { opacity: 0; transform: scale(0.9); }
			to { opacity: 1; transform: scale(1); }
		}

		/* 拍手加载动画 */
		.hand-wrap {
			display: none;
			width: 60px;
			height: 45px;
			margin: 0 auto;
			transform: scale(0.75);
		}
		.hand {
		  --skin-color: #E4C560;
		  --tap-speed: 0.6s;
		  --tap-stagger: 0.1s;
		  position: relative;
		  width: 80px;
		  height: 60px;
		  margin-left: 80px;
		}
		.hand:before {
		  content: '';
		  display: block;
		  width: 180%;
		  height: 75%;
		  position: absolute;
		  top: 70%;
		  right: 20%;
		  background-color: black;
		  border-radius: 40px 10px;
		  filter: blur(10px);
		  opacity: 0.3;
		}
		.palm {
		  display: block;
		  width: 100%;
		  height: 100%;
		  position: absolute;
		  top: 0;
		  left: 0;
		  background-color: var(--skin-color);
		  border-radius: 10px 40px;
		}
		.thumb {
		  position: absolute;
		  width: 120%;
		  height: 38px;
		  background-color: var(--skin-color);
		  bottom: -18%;
		  right: 1%;
		  transform-origin: calc(100% - 20px) 20px;
		  transform: rotate(-20deg);
		  border-radius: 30px 20px 20px 10px;
		  border-bottom: 2px solid rgba(0, 0, 0, 0.1);
		  border-left: 2px solid rgba(0, 0, 0, 0.1);
		}
		.thumb:after {
		  width: 20%;
		  height: 60%;
		  content: '';
		  background-color: rgba(255, 255, 255, 0.3);
		  position: absolute;
		  bottom: -8%;
		  left: 5px;
		  border-radius: 60% 10% 10% 30%;
		  border-right: 2px solid rgba(0, 0, 0, 0.05);
		}
		.finger {
		  position: absolute;
		  width: 80%;
		  height: 35px;
		  background-color: var(--skin-color);
		  bottom: 32%;
		  right: 64%;
		  transform-origin: 100% 20px;
		  animation-duration: calc(var(--tap-speed) * 2);
		  animation-timing-function: ease-in-out;
		  animation-iteration-count: infinite;
		  transform: rotate(10deg);
		}
		.finger:before {
		  content: '';
		  position: absolute;
		  width: 140%;
		  height: 30px;
		  background-color var(--skin-color);
		  bottom: 8%;
		  right: 65%;
		  transform-origin: calc(100% - 20px) 20px;
		  transform: rotate(-60deg);
		  border-radius: 20px;
		}
		.finger:nth-child(1) { animation-delay: 0; filter: brightness(70%); animation-name: tap-upper-1; }
		.finger:nth-child(2) { animation-delay: var(--tap-stagger); filter: brightness(80%); animation-name: tap-upper-2; }
		.finger:nth-child(3) { animation-delay: calc(var(--tap-stagger) * 2); filter: brightness(90%); animation-name: tap-upper-3; }
		.finger:nth-child(4) { animation-delay: calc(var(--tap-stagger) * 3); filter: brightness(100%); animation-name: tap-upper-4; }
		@keyframes tap-upper-1 { 0%,50%,100%{transform:rotate(10deg)scale(0.4);}40%{transform:rotate(50deg)scale(0.4);} }
		@keyframes tap-upper-2 { 0%,50%,100%{transform:rotate(10deg)scale(0.6);}40%{transform:rotate(50deg)scale(0.6);} }
		@keyframes tap-upper-3 { 0%,50%,100%{transform:rotate(10deg)scale(0.8);}40%{transform:rotate(50deg)scale(0.8);} }
		@keyframes tap-upper-4 { 0%,50%,100%{transform:rotate(10deg)scale(1);}40%{transform:rotate(50deg)scale(1);} }

		/* 视频容器 移动端终极兼容 */
		.video-wrap {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			height: 100dvh;
			z-index: 0;
			overflow: hidden;
		}
		.video-item {
			position: absolute;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			height: 100dvh;
			object-fit: cover;
			-webkit-object-fit: cover;
			transition: opacity var(--transition-long);
			opacity: 0;
			transform: scale(1.08);
			filter: blur(8px);
			-webkit-filter: blur(8px);
			/* 移动端播放强制属性 */
			muted muted;
			autoplay autoplay;
			loop loop;
			playsinline true;
			-webkit-playsinline true;
			webkit-playsinline true;
			preload="auto";
		}
		.video-item.active {
			opacity: 1;
			transform: scale(1);
			filter: blur(0px);
			-webkit-filter: blur(0px);
		}
		.mask-overlay {
			position: absolute;
			inset: 0;
			background: rgba(0, 0, 0, 0.1);
			z-index: 1;
		}

		/* 导航栏 */
		header {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			z-index: 10;
		}
		.nav-container {
			max-width: 1340px;
			margin: 0 auto;
			padding: 36px 15px;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}
		@media (min-width: var(--tablet-min)) and (max-width: var(--tablet-max)) {
			.nav-container { padding: 30px 18px; }
		}
		@media (max-width: var(--mobile-break)) {
			.nav-container { padding: 24px 18px; }
		}
		.desktop-nav { display: flex; gap: 24px; list-style: none; }
		@media (max-width: var(--mobile-break)) { .desktop-nav { display: none; } }
		.nav-link { position: relative; text-decoration: none; color: #fff; }
		.nav-link::after {
			content: "";
			position: absolute;
			bottom: -2px;
			left: 0;
			width: 100%;
			height: 1px;
			background: #fff;
			transform: scaleX(0);
			transform-origin: right;
			transition: transform 0.3s var(--ease-spring);
		}
		.nav-link:hover::after { transform: scaleX(1); transform-origin: left; }
		.nav-num { font-size: 8px; line-height: 12px; letter-spacing: -0.08px; font-weight: 500; text-transform: uppercase; display: block; }
		.nav-text { font-size: 12px; line-height: 16px; letter-spacing: -0.12px; font-weight: 500; text-transform: uppercase; display: block; }
		.nav-right-info { display: flex; align-items: center; gap: 32px; font-size: 12px; }
		@media (max-width: var(--mobile-break)) { .nav-right-info { display: none; } }
		.menu-toggle { display: none; background: transparent; border: none; color: white; font-size: 14px; text-transform: uppercase; cursor: pointer; }
		@media (max-width: var(--mobile-break)) { .menu-toggle { display: block; } }
		.mobile-menu-panel {
			max-width: 1340px;
			margin: 0 auto;
			padding: 0 18px;
			display: grid;
			grid-template-rows: 0fr;
			transition: grid-template-rows 420ms var(--ease-spring);
		}
		.mobile-menu-panel.open { grid-template-rows: 1fr; }
		.mobile-menu-inner { overflow: hidden; padding: 24px 0; }
		.mobile-bottom-info { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; font-size: 14px; }

		/* 主体内容 */
		main {
			position: relative;
			z-index: 2;
			min-height: 100vh;
			min-height: 100dvh;
			max-width: 1340px;
			margin: 0 auto;
			padding: 190px 15px 0;
			display: flex;
			flex-direction: column;
			justify-content: flex-end;
			align-items: flex-end;
			gap: 150px;
		}
		@media (min-width: var(--tablet-min)) and (max-width: var(--tablet-max)) {
			main { gap: 112px; padding-bottom: 52px; }
		}
		@media (max-width: var(--mobile-break)) {
			main { padding: 140px 18px 0; justify-content: flex-start; align-items: flex-start; gap: 72px; }
		}
		.switch-row { width: 100%; display: flex; gap: 32px; }
		@media (max-width: var(--mobile-break)) { .switch-row { flex-direction: column; gap: 28px; } }
		.switch-buttons { flex: 4; display: flex; flex-direction: row; gap: 32px; }
		@media (max-width: var(--mobile-break)) { .switch-buttons { flex-wrap: wrap; gap: 16px; } }
		.switch-btn {
			background: transparent;
			border: none;
			color: #fff;
			text-align: left;
			cursor: pointer;
			opacity: 0.55;
			transition: transform 0.3s var(--ease-spring), opacity 0.3s ease;
			white-space: nowrap;
		}
		.switch-btn:hover { opacity: 0.75; transform: translateX(4px); }
		.switch-btn.active { opacity: 1; }
		.available-wrap { flex: 1; display: flex; align-items: center; gap: 12px; }
		.pulse-dot { width: 7px; height: 7px; border-radius: 50%; animation: dotPulse 1.6s infinite ease-in-out; }
		@keyframes dotPulse { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.45;transform:scale(1.45);} }

		/* 标语切换动画 */
		.slogan-text {
			transition: all var(--transition-long);
			opacity: 1;
			transform: scale(1);
			filter: blur(0px);
			-webkit-filter: blur(0px);
		}
		.slogan-fade {
			opacity: 0 !important;
			transform: scale(0.85) !important;
			filter: blur(6px) !important;
			-webkit-filter: blur(6px) !important;
		}

		.bottom-content-row { width: 100%; display: flex; gap: 40px; padding-bottom: 60px; align-items: flex-end; }
		@media (max-width: var(--mobile-break)) { .bottom-content-row { flex-direction: column; gap: 32px; padding-bottom: 44px; } }
		.login-box { flex: 2; display: flex; flex-direction: column; gap: 20px; }
		.login-input {
			width: 320px;
			height: 48px;
			padding: 0 16px;
			background: rgba(255,255,255,0.06);
			border: 1px solid #38bdf860;
			border-radius: 8px;
			color: #fff;
			font-size: 16px;
			transition: all 0.3s ease;
		}
		.login-input::placeholder { color: #ffffff60; }
		.login-input:hover { border-color: #38bdf8; box-shadow: 0 0 10px #38bdf840; }
		.login-input:focus { border-color: #38bdf8; box-shadow: 0 0 16px #38bdf870; background: rgba(255,255,255,0.09); }
		.text-cta-box { flex: 1; padding-left: 50px; }
		@media (max-width: var(--tablet-max)) { .text-cta-box { padding-left: 0; } }
		@media (max-width: var(--mobile-break)) { .text-cta-box { padding-left: 0; } }

		/* 底部文字切换动画 */
		.desc-text {
			font-size: 16px;
			line-height: 24px;
			letter-spacing: -0.16px;
			font-weight: 500;
			max-width: 420px;
			transition: all var(--transition-long);
			opacity: 1;
			transform: scale(1);
			filter: blur(0px);
			-webkit-filter: blur(0px);
		}
		.desc-text.fade-out {
			opacity: 0;
			transform: scale(0.88);
			filter: blur(7px);
			-webkit-filter: blur(7px);
		}
		.desc-text.show-animate { animation: revealRight 0.9s var(--ease-spring) 0.04s forwards; }
		#ctaBtn { margin-top: 24px; opacity: 0; transform: translateX(100px); display: inline-block; }
		#ctaBtn.show-animate { animation: revealRight 0.9s var(--ease-spring) 0.08s forwards; }
		@keyframes revealRight { to { opacity: 1; transform: translateX(0); } }

		/* 邮箱按钮、登录按钮样式省略，完整代码已包含 */
		.btn-wrapper {
		  --color: #b5faff31; --txt-color: #fff; --txt-color-2: #F598F2; --point-size:8px; --point-color:#fff; --line-color:#fff40; --line-style:solid; --line-weight:1px; --anim-speed:1s;
		  position: relative; display: grid; place-items: center; padding: 0.6rem 1.2rem; min-width:140px; min-height:36px; user-select:none;
		}
		.txt-secondary { position:absolute; bottom:-1.6rem; font:400 0.75em "Inter"; color:#ffffff77; font-style:italic; transition:opacity calc(var(--anim-speed)*0.5) ease; opacity:1; }
		#hint2 { opacity:0; }
		.btn { filter: drop-shadow(0 6px 2px #00055) drop-shadow(0 14px 4px #00055) drop-shadow(0 32px 8px #00055) drop-shadow(0 64px 16px #00055); position:absolute; display:flex; align-items:center; justify-content:center; border:none; background:none; width:100%; height:100%; cursor:pointer; }
		.txt-box { position:absolute; display:grid; place-items:center; text-wrap:nowrap; inset:0 0%; overflow:clip; transition:filter 0.25s ease; animation:frame-half calc(var(--anim-speed)*0.5) forwards; }
		.txt-box::after { content:""; position:absolute; inset:var(--point-size); background:repeating-linear-gradient(45deg,#3f87a6,#ebf8e1 15%,#fff 20%); mix-blend-mode:hard-light; background-size:440%; transition:background-size 0.4s ease-in; filter:blur(1px); z-index:3; opacity:0.1; }
		.txt { position:absolute; padding:0.6rem 1rem; z-index:2; font:500 1em "Inter"; color:var(--txt-color); text-shadow:0 -1px 1px #fff60,0 2px 1px #00015,0 4px 2px #00015,0 8px 4px #00015,0 16px 8px #00015; }
		.txt:last-child { color:var(--txt-color-2); opacity:0; animation:none; }
		.frame { position:absolute; inset:0 0%; z-index:1; border:var(--line-style) var(--line-weight) var(--line-color); background:var(--color); transition-delay:calc(var(--anim-speed)*0.5); box-shadow:inset 0 1px 4px #fff5; animation:frame-half calc(var(--anim-speed)*0.5) forwards; }
		.point { position:absolute; box-sizing:border-box; width:var(--point-size); aspect-ratio:1; border-radius:25%; border:solid var(--line-weight) var(--line-color); background:var(--point-color); background-image:radial-gradient(circle at 50% 120%,#0005,#ffff); }
		.point.top { top:calc(var(--point-size)*-0.5); } .point.bottom { bottom:calc(var(--point-size)*-0.5); } .point.left { left:calc(var(--point-size)*-0.5); } .point.right { right:calc(var(--point-size)*-0.5); }
		.btn:hover .txt { animation:txt-out calc(var(--anim-speed)*0.5) forwards; }
		.btn:hover .txt:last-child { animation:txt-in calc(var(--anim-speed)*0.5) forwards; }
		.btn:hover .txt-box { animation:frame var(--anim-speed) ease; }
		.btn:hover .txt-box::after { background-size:700%; }
		.btn:hover .frame { animation:frame var(--anim-speed) ease; }
		.btn:hover ~ #hint1 { opacity:0; } .btn:hover ~ #hint2 { opacity:1; }
		@keyframes txt-in { 90%{opacity:0;}100%{opacity:1;} }
		@keyframes txt-out { 50%{opacity:1;}100%{opacity:0;} }
		@keyframes frame-half { 0%{inset:0 50%;}100%{inset:0 0%;} }
		@keyframes frame { 50%{inset:0 50%;} }
		.btn::before { content:"Address copied"; position:absolute; inset:0; font:400 1em "Inter"; letter-spacing:0.03em; color:#fff; z-index:-1; filter:blur(16px); opacity:0; }
		.btn:active .txt-box { filter:contrast(1.4) brightness(1.4); }
		.btn:focus::before { animation:appear calc(var(--anim-speed)*1.5) cubic-bezier(0.175,0.885,0.32,1.275) forwards; }
		@keyframes appear { 70%{opacity:0.75;filter:blur(0);}100%{transform:translateY(-24px);} }

		.main-cta-btn {
			display: inline-block; width:150px; height:50px; border-radius:10px; border:1px solid #38bdf8; position:relative; overflow:hidden; transition:all 0.5s ease-in; z-index:1; background:transparent; cursor:pointer;
		}
		.main-cta-btn::before, .main-cta-btn::after {
			content:''; position:absolute; top:0; width:0; height:100%; transform:skew(15deg); transition:all 0.5s; overflow:hidden; z-index:-1;
		}
		.main-cta-btn::before { left:-10px; background:#0284c7; }
		.main-cta-btn::after { right:-10px; background:#0ea5e9; }
		.main-cta-btn:hover::before, .main-cta-btn:hover::after { width:58%; }
		.main-cta-btn:hover span { color:#fff; transition:0.3s; }
		.main-cta-btn span { color:#38bdf8; font-size:18px; font-weight:600; transition:all 0.3s ease-in; position:relative; z-index:2; }
	</style>
</head>
<body>
	<div class="modal-mask" id="modalMask">
		<div class="modal-box">
			<div class="hand-wrap" id="handLoader">
				<div class="hand">
					<div class="palm"></div>
					<div class="thumb"></div>
					<div class="finger"></div>
					<div class="finger"></div>
					<div class="finger"></div>
					<div class="finger"></div>
				</div>
			</div>
			<p class="modal-text" id="modalText"></p>
			<button class="modal-btn" id="modalOkBtn" onclick="closeModal()">确定</button>
		</div>
	</div>

	<div class="video-wrap">
		<video class="video-item" data-index="0">
			<source src="img/7月9日(2).mp4">
		</video>
		<video class="video-item" data-index="1">
			<source src="img/7月9日.mp4">
		</video>
		<video class="video-item" data-index="2">
			<source src="img/7月9日(1).mp4">
		</video>
		<div class="mask-overlay"></div>
	</div>

	<header>
		<nav class="nav-container">
			<ul class="desktop-nav">
				<li><a href="#" class="nav-link"><span class="nav-num">01</span><span class="nav-text">首页</span></a></li>
				<li><a href="#" class="nav-link"><span class="nav-num">02</span><span class="nav-text">产品</span></a></li>
				<li><a href="#" class="nav-link"><span class="nav-num">03</span><span class="nav-text">关于</span></a></li>
				<li><a href="#" class="nav-link"><span class="nav-num">04</span><span class="nav-text">目录</span></a></li>
			</ul>
			<div class="nav-right-info">
				<div class="btn-wrapper">
					<span class="txt-secondary" id="hint1">Hover to view mail</span>
					<span class="txt-secondary" id="hint2">Click to copy</span>
					<button class="btn" onclick="copyMail()">
						<div class="txt-box">
							<span class="txt">Davies@gmail.com</span>
							<span class="txt">Contact Mail</span>
						</div>
						<div class="frame">
							<div class="point top left"></div>
							<div class="point top right"></div>
							<div class="point bottom left"></div>
							<div class="point bottom right"></div>
						</div>
					</button>
				</div>
				<span class="clock-text">时间 00:00:00</span>
			</div>
			<button class="menu-toggle" id="menuBtn">菜单</button>
		</nav>
		<div class="mobile-menu-panel" id="mobileMenu">
			<div class="mobile-menu-inner">
				<div class="mobile-bottom-info">
					<div class="btn-wrapper">
						<span class="txt-secondary" id="hint1">Hover to view mail</span>
						<span class="txt-secondary" id="hint2">Click to copy</span>
						<button class="btn" onclick="copyMail()">
							<div class="txt-box">
								<span class="txt">diaomao@email.com</span>
								<span class="txt">Contact Mail</span>
							</div>
							<div class="frame">
								<div class="point top left"></div>
								<div class="point top right"></div>
								<div class="point bottom left"></div>
								<div class="point bottom right"></div>
							</div>
						</button>
					</div>
					<span class="clock-text mobile-clock">时间 00:00:00</span>
				</div>
			</div>
		</div>
	</header>

	<main id="heroBox">
		<section class="switch-row">
			<div class="switch-buttons">
				<button class="switch-btn active" data-target="0">01 / Nation Emblem</button>
				<button class="switch-btn" data-target="1">02 / Red flag</button>
				<button class="switch-btn" data-target="2">03 / Sky</button>
			</div>
			<div class="available-wrap">
				<span class="pulse-dot" id="statusDot"></span>
				<span class="slogan-text" id="sloganText">心怀家国，砥砺前行</span>
			</div>
		</section>
		<section class="bottom-content-row">
			<div class="login-box">
				<input class="login-input" id="userInput" type="text" placeholder="请输入账号">
				<input class="login-input" id="pwdInput" type="password" placeholder="请输入密码">
			</div>
			<div class="text-cta-box">
				<p class="desc-text" id="descTxt">
					革命不是请客吃饭，不是做文章，不是绘画绣花，不能那样雅致，那样从容不迫，文质彬彬，那样温良恭俭让。革命是暴动，是一个阶级推翻一个阶级的暴烈的行动。农村革命是农民阶级推翻封建地主阶级的权力的革命。农民若不用极大的力量，决不能推翻几千年根深蒂固的地主权力。
				</p>
				<div id="ctaBtn">
					<button class="main-cta-btn" onclick="loginCheck()">
						<span>登录</span>
					</button>
				</div>
			</div>
		</section>
	</main>

	<script>
		const modalMask = document.getElementById("modalMask");
		const modalText = document.getElementById("modalText");
		const handLoader = document.getElementById("handLoader");
		const modalOkBtn = document.getElementById("modalOkBtn");
		function showModal(msg) {
			modalText.style.display = "block"; handLoader.style.display = "none"; modalOkBtn.style.display = "block"; modalText.innerText = msg; modalMask.classList.add("show");
		}
		function showHandLoader() {
			handLoader.style.display = "block"; modalText.style.display = "block"; modalText.innerText = "登录成功，请耐心等待..."; modalOkBtn.style.display = "none"; modalMask.classList.add("show");
		}
		function closeModal() { modalMask.classList.remove("show"); }
		function copyMail() { navigator.clipboard.writeText("Davies@gmail.com") }
		const API_URL = "http://127.0.0.1:5000/api/login";
		async function loginCheck() {
			const user = document.getElementById("userInput").value.trim();
			const pwd = document.getElementById("pwdInput").value.trim();
			if (!user || !pwd) { showModal("账号密码不能为空"); return; }
			try {
				const res = await axios.post(API_URL, {username: user, password: pwd});
				const data = res.data;
				if (data.code === 200) {
					showHandLoader();
					setTimeout(()=>window.location.href=data.redirectUrl,3000);
				} else showModal(data.msg);
			} catch (err) { showModal("服务器连接失败，请先启动后端服务"); }
		}

		let activeIndex = 0;
		const PINK = "#F598F2";
		const WHITE = "#ffffff";
		const videoItems = document.querySelectorAll(".video-item");
		const switchBtns = document.querySelectorAll(".switch-btn");
		const dotEl = document.getElementById("statusDot");
		const descTxt = document.getElementById("descTxt");
		const ctaBtn = document.getElementById("ctaBtn");
		const menuBtn = document.getElementById("menuBtn");
		const mobileMenu = document.getElementById("mobileMenu");
		const clockTexts = document.querySelectorAll(".clock-text");
		const sloganText = document.getElementById("sloganText");

		const textList = [
			`革命不是请客吃饭，不是做文章，不是绘画绣花，不能那样雅致，那样从容不迫，文质彬彬，那样温良恭俭让。革命是暴动，是一个阶级推翻一个阶级的暴烈的行动。农村革命是农民阶级推翻封建地主阶级的权力的革命。农民若不用极大的力量，决不能推翻几千年根深蒂固的地主权力。`,
			`百年风雨兼程，百年砥砺前行。红色旗帜承载着无数先辈的热血与理想，一代代共产党人前赴后继，为民族独立、人民解放不懈奋斗，红色信仰永远不会褪色。`,
			`抬头仰望万里长空，风云翻涌，山河辽阔。新时代的青年当心怀家国，乘风而上，以理想为帆，以奋斗为桨，扬帆启航奔赴属于我们的远大前程。`
		];
		const sloganList = ["心怀家国，砥砺前行","百年薪火，永志不忘","以梦为帆，扬帆启航"];

		// 页面加载强制播放所有视频，修复移动端不自动播放黑屏
		function initVideoPlay() {
			videoItems.forEach(vid => {
				vid.load();
				vid.play().catch(()=>{});
			})
		}
		window.addEventListener('DOMContentLoaded', initVideoPlay);
		window.addEventListener('touchstart', initVideoPlay, {once:true});
		videoItems[0].classList.add("active");

		function setActiveVideo(idx) {
			activeIndex = idx;
			videoItems.forEach(v=>{ v.classList.remove("active"); v.pause(); });
			videoItems[idx].classList.add("active");
			videoItems[idx].play().catch(()=>{});

			switchBtns.forEach(b=>b.classList.remove("active"));
			switchBtns[idx].classList.add("active");

			dotEl.style.background = idx === 0 ? PINK : WHITE;
			dotEl.style.boxShadow = `0 0 12px ${idx === 0 ? PINK : WHITE}`;

			descTxt.classList.add("fade-out");
			sloganText.classList.add("slogan-fade");
			setTimeout(()=>{
				descTxt.textContent = textList[idx];
				sloganText.textContent = sloganList[idx];
				descTxt.classList.remove("fade-out");
				sloganText.classList.remove("slogan-fade");
			},600);
		}
		switchBtns.forEach(btn=>btn.addEventListener("click",()=>setActiveVideo(Number(btn.dataset.target))));

		let menuOpen = false;
		menuBtn.addEventListener("click",()=>{
			menuOpen = !menuOpen;
			mobileMenu.classList.toggle("open",menuOpen);
			menuBtn.innerText = menuOpen ? "Close" : "Menu";
		})
		function updateClock() {
			const now = new Date();
			const h = String(now.getHours()).padStart(2,"0");
			const m = String(now.getMinutes()).padStart(2,"0");
			const s = String(now.getSeconds()).padStart(2,"0");
			const timeStr = `时间 ${h}:${m}:${s}`;
			clockTexts.forEach(el=>el.innerText=timeStr);
		}
		updateClock(); setInterval(updateClock,1000);
		const observer = new IntersectionObserver(e=>{
			if(e[0].isIntersecting){ descTxt.classList.add("show-animate"); ctaBtn.classList.add("show-animate"); observer.disconnect(); }
		},{threshold:0.35})
		observer.observe(document.getElementById("heroBox"));
	</script>
</body>
</html>
